<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noise CPU / GPU - Scala WebGPU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 4px;
    }

    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #8888aa;
      text-decoration: none;
    }

    .back-link:hover {
      color: #aaaacc;
    }
  </style>
</head>

<body>
  <a href="/" class="back-link">&larr; Back to examples</a>
  <div id="container">
    <canvas id="canvas" width="1200" height="600"></canvas>
    <p id="label" style="color: #ccccee; font-family: monospace"></p>
    <p style="color: #7a7a9a; font-size: 0.8rem">left: GPU per pixel · right: CPU per cell · click to cycle</p>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
