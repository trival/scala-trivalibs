<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bevel Lines 2D - Scala WebGPU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    #container {
      width: 100vw;
      height: 100vh;
      gap: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #8888aa;
      text-decoration: none;
    }

    .back-link:hover {
      color: #aaaacc;
    }
  </style>
</head>

<body>
  <a href="/" class="back-link">&larr; Back to examples</a>
  <div id="container">
    <canvas id="canvas"></canvas>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
